# 公開フェーズ用の構成。sync がリポジトリをミラーし、bot はそれを読み取り専用でマウントする
services:
  sync:
    image: alpine/git:latest
    entrypoint: ["/bin/sh", "/scripts/sync_repo.sh"]
    environment:
      REPO_URL: git@github.com:hacarus/hacarus-check-2025.git
      REPO_PATH: /repo
      BRANCH: develop
      SYNC_INTERVAL: "1800"
      GIT_SSH_COMMAND: ssh -i /keys/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new
    volumes:
      - ./scripts/sync_repo.sh:/scripts/sync_repo.sh:ro
      # GitHub に「Allow write access」を付けずに登録した Deploy key
      - ./keys:/keys:ro
      - repo:/repo
    restart: unless-stopped

  bot:
    build: .
    env_file: .env
    environment:
      REPO_PATH: /repo
      DB_PATH: /data/qa_bot.sqlite3
    volumes:
      - repo:/repo:ro
      - data:/data
      # 会話の続きに使うセッションの記録
      - home:/home/qabot
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on: [sync]
    restart: unless-stopped

volumes:
  repo:
  data:
  home:
