# Slack アプリを作るときのマニフェスト
# https://api.slack.com/apps →「Create New App」→「From an app manifest」に貼り付ける
# 社内のワークスペースに作る(社外のワークスペースには社内の情報を載せない)。検証中は ALLOWED_SLACK_USERS で自分だけに限る
display_information:
  name: HACARUS Check 相談窓口
  description: HACARUS Check 2025 のリポジトリについて質問できるボット(読み取り専用)
# AI アプリのパネル(会話の一覧)は最初は使わない。使うときは features に assistant_view、
# スコープに assistant:write、イベントに assistant_thread_started を足し、.env を SLACK_ASSISTANT=true にする(docs/slack-app.md)
features:
  app_home:
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: check-qa
    always_online: true
  slash_commands:
    - command: /qa-cost
      description: 利用件数・評価・仮想料金の集計を表示する(管理者のみ)
      usage_hint: "[YYYY-MM]"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - im:history
      # メンションされたときに、そのスレッドやチャンネルの直前の発言を読む(質問の背景を知るため)
      - channels:history
      - groups:history
      # チャンネルが社外と共有されていないかを確かめる
      - channels:read
      - groups:read
      - commands
      # 質問に添付されたスクリーンショットやログを読む
      - files:read
      # ALLOWED_SLACK_USERS / ADMIN_SLACK_USERS に書いたユーザーグループのメンバーを読む
      - usergroups:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
  # 評価ボタンと 👎 の理由の入力に使う
  interactivity:
    is_enabled: true
  # 公開 URL が不要な Socket Mode を使う。App-Level Token(connections:write)の発行が別途必要
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
